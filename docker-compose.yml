# DRAY-WORLD LOGISTICS — single-VPS deployment.
#
#   postgres  PostgreSQL 16, data on the host at ${DATA_ROOT}/postgres
#   app       Next.js standalone server, bound to 127.0.0.1:3000 (Nginx on the host proxies to it)
#   tools     one-shot container with the Prisma CLI for migrations / admin bootstrap
#             (profile "tools" — never started by `docker compose up`)
#
# Everything business-critical lives in bind mounts under ${DATA_ROOT}, so
# rebuilding / replacing containers never touches the data.

name: dray-world

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: ${APP_URL}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  DOCUMENT_STORAGE_PATH: /data/documents
  MAX_DOCUMENT_SIZE_MB: ${MAX_DOCUMENT_SIZE_MB:-20}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/postgres:/var/lib/postgresql/data
    # Loopback only: reachable from the host (backups, local dev) but never from the internet.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5446}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
    image: dray-world-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/documents:/data/documents
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  tools:
    build:
      context: .
      target: tools
    image: dray-world-tools:latest
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/documents:/data/documents
    command: ["pnpm", "db:migrate:deploy"]
